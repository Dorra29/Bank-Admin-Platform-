<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank AD Login</title>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
        * { box-sizing: border-box; }

        :root {
            --page-bg: #0f172a;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.3);
            --text-heading: #0f172a;
            --text-body: #64748b;
            --label-color: #334155;
            --input-border: #cbd5e1;
            --input-bg: #ffffff;
            --input-text: #1a1a1a;
            --accent: #2563eb;
            --accent-text: #ffffff;
            --error-text: #991b1b;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --toggle-bg: #ffffff;
            --toggle-border: #e2e8f0;
            --toggle-icon: #0f172a;
        }

        html[data-theme="dark"] {
            --page-bg: #0b1120;
            --card-bg: #1e293b;
            --card-shadow: rgba(0,0,0,0.55);
            --text-heading: #f1f5f9;
            --text-body: #94a3b8;
            --label-color: #cbd5e1;
            --input-border: #475569;
            --input-bg: #0f172a;
            --input-text: #e2e8f0;
            --accent: #3b82f6;
            --accent-text: #ffffff;
            --error-text: #f87171;
            --error-bg: rgba(220,38,38,0.12);
            --error-border: #7f1d1d;
            --toggle-bg: #1e293b;
            --toggle-border: #334155;
            --toggle-icon: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--page-bg);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.25s ease;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--toggle-border);
            background: var(--toggle-bg);
            color: var(--toggle-icon);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
        }
        .theme-toggle:hover { transform: scale(1.06); }
        .theme-toggle svg { width: 20px; height: 20px; }
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
        .login-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 36px 32px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 10px 30px var(--card-shadow);
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
        }
        .login-card h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            color: var(--text-heading);
            transition: color 0.25s ease;
        }
        .login-card p {
            margin: 0 0 20px 0;
            color: var(--text-body);
            font-size: 13px;
            transition: color 0.25s ease;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--label-color);
            margin-bottom: 4px;
            font-weight: 500;
            transition: color 0.25s ease;
        }
        input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--input-text);
        }
        button {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.92; }
        .error { color: var(--error-text); background: var(--error-bg); border: 1px solid var(--error-border); padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>

<body>

<button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false">
  <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<div class="login-card">
    <h1>Bank AD Portal</h1>
    <p>Sign in with your Active Directory account</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username">

        <label>Password</label>
        <input type="password" name="password">

        <button type="submit">Login</button>
    </form>
</div>

<script>
function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.getElementById('theme-toggle').setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
}

document.addEventListener('DOMContentLoaded', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('theme-toggle').setAttribute('aria-pressed', isDark ? 'true' : 'false');
});
</script>

</body>
</html>
