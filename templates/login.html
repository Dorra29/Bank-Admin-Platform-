<!DOCTYPE html>
<html>
<head>
    <title>Bank AD Login</title>
</head>

<body>

<h2>Login</h2>

<form method="POST">

    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username">

    <br>

    <label>Password:</label>
    <input type="password" name="password">

    <br>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
