<h1>
Create AD User
</h1>


{% if message %}

<p>
{{message}}
</p>

{% endif %}



<form method="POST">

{% csrf_token %}


<input 
name="username"
placeholder="Username">


<input
name="first_name"
placeholder="First name">



<input
name="last_name"
placeholder="Last name">



<input
name="password"
placeholder="Password"
type="password">

<select name="ou">
    <option value="Admins">Admins</option>
    <option value="Managers">Managers</option>
    <option value="Employees">Employees</option>
</select>


<button>
Create User
</button>


</form>
